# ---------------------------------------------------------------------------
# HTTP: solo dos cosas, el reto de Let's Encrypt y el redirigir a HTTPS.
#
# El reto va ANTES del redirect a proposito. Si se redirigiera todo, la
# renovacion del certificado no podria completarse y el sitio se caeria a los
# 90 dias, que es el peor momento para descubrirlo.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Archivos del build crudos, para el backend. Los necesita para armar
    # /r/:slug, /restaurantes y /llms.txt, y dentro de SU contenedor no existe
    # ningun frontend/dist: son imagenes separadas. Pedirselos a Nginx mantiene
    # una sola fuente de verdad —los mismos archivos que se sirven al visitante—
    # sin duplicar el build.
    #
    # Va aqui, antes del redirect, porque `location /` mandaria un 301 a
    # https://bitemo.co, y el contenedor tendria que salir a Internet y volver
    # por Cloudflare para leer un archivo que esta a su lado.
    #
    # Restringido a la red privada de Docker: el puerto 80 es publico, y esta
    # ruta no lleva el redirect a HTTPS.
    #
    # Es un prefijo y no una ruta exacta porque ya son varios archivos:
    # app.html (el cascaron de la SPA) y paginas.json (el indice de guias).
    location /_interno/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        alias /usr/share/nginx/html/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: el sitio.
#
# Va PRIMERO porque el primer bloque que escucha en 443 es el que atiende
# cualquier peticion con un Host desconocido (la IP del servidor, un dominio
# apuntado por error). Que ese caso caiga en el sitio y no en el redirector es
# lo menos sorprendente.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name bitemo.co;

    ssl_certificate     /etc/letsencrypt/live/bitemo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitemo.co/privkey.pem;

    # Solo TLS 1.2 y 1.3: las versiones anteriores estan rotas y ningun telefono
    # que pueda reproducir el menu se queda fuera por esto.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la version exacta de Nginx: le ahorra a un atacante el paso de
    # averiguar contra que CVE puede tirar.
    server_tokens off;

    include /etc/nginx/cabeceras-seguridad.conf;

    # Compresion de textos (el video NO pasa por aqui, va directo desde Bunny CDN).
    # Los sitemap son XML y pesan; sin application/xml viajaban sin comprimir.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # Cortafuegos contra Slowloris: sin esto, el valor por defecto de 60 s deja
    # que unas pocas conexiones lentas ocupen al unico worker indefinidamente.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Los videos se suben directo del navegador a Bunny, no por aquí,
    # así que no necesitamos un límite de subida grande.
    client_max_body_size 5m;

    # Documentacion interna y archivos ocultos: no son parte del producto.
    # /marca/LEEME.md se estaba sirviendo con 200 a cualquiera.
    location ~ /\. { deny all; }
    location ~* \.(md|map)$ { deny all; }

    # --- Lo que sale de la base de datos: al backend ---

    # API
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un backend colgado no debe dejar la peticion abierta para siempre.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Vitrina publica de cada restaurante. Va al backend y NO al HTML estatico
    # porque el backend le inyecta el titulo, la descripcion, los datos
    # estructurados y la carta ya escrita en HTML.
    #
    # Sin esto, la SPA devolveria el mismo cascaron vacio para todos los
    # restaurantes: quien comparte el enlace veria la vista previa generica de
    # Antojate, y los rastreadores de IA —que no ejecutan JavaScript— no verian
    # absolutamente nada de la carta.
    location /r/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Directorio de restaurantes y paginas de ciudad. La expresion regular acota
    # a esas dos formas exactas: un prefijo pelado tambien se habria tragado
    # /restaurantes-de-lo-que-sea, que no existe y debe dar 404.
    location ~ ^/restaurantes(/[a-z0-9-]+)?$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Se generan desde la base: un restaurante nuevo aparece sin recompilar ni
    # desplegar el frontend. El indice /sitemap.xml y /sitemap-paginas.xml SI
    # son estaticos (salen del build) y los sirve Nginx desde el disco.
    location ~ ^/(sitemap-restaurantes\.xml|llms\.txt)$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # --- Lo que sirve Nginx ---

    # Rutas de la SPA que existen pero no se indexan: el panel, la cocina, el
    # login (y recuperar/restablecer la clave) y el menu del comensal (que ni
    # siquiera funciona sin su token de mesa). Reciben el cascaron vacio, y con la cabecera de noindex ademas del
    # robots.txt: robots.txt pide que no se RASTREE, y una URL no rastreada
    # puede aparecer igual en el indice si alguien la enlaza. El encabezado lo
    # cierra.
    location ~ ^/(menu|login|recuperar|restablecer|cocina|admin)(/|$) {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /app.html =404;
    }

    # index.html y app.html NUNCA se cachean: apuntan a los assets con hash, asi
    # que un index viejo en cache deja al visitante pidiendo bundles que ya no
    # existen despues de cada despliegue.
    location ~ ^/(index|app|404)\.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/cabeceras-seguridad.conf;
    }

    # Cache larga para los assets con hash en el nombre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/cabeceras-seguridad.conf;
    }

    # El resto: el archivo pedido, su version .html (asi /guias sirve guias.html
    # sin barra final ni redireccion), o un 404 DE VERDAD.
    #
    # Antes esto era `try_files $uri $uri/ /index.html`, y ahi estaba el peor
    # problema de indexacion del sitio: CUALQUIER direccion inventada respondia
    # 200 con el index, y React la mandaba a la portada. Para Google eso es un
    # soft 404 e infinitas URLs validas; ademas hacia que /marca/og.png
    # —que no existe— devolviera una pagina HTML haciendose pasar por imagen,
    # que es lo que rompia las vistas previas al compartir el enlace.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # La pagina de "no encontrado" del build. Se sirve CON estado 404, que es la
    # diferencia entre decirle a un buscador "esto no existe" y mentirle.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }
}

# ---------------------------------------------------------------------------
# HTTPS en www: redirige a la raiz.
#
# Antes www.bitemo.co servia el sitio entero con estado 200. La etiqueta
# canonical evitaba lo peor, pero un buscador seguia rastreando las dos copias
# y repartiendo entre ellas los enlaces que reciba el sitio. Con el 301 hay una
# sola direccion y todo suma en el mismo sitio.
#
# El certificado es el mismo: cubre los dos nombres.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.bitemo.co;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bitemo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitemo.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS tambien aqui: sin ella, la primera visita a www por HTTP seguiria
    # siendo interceptable aunque el destino final sea seguro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://bitemo.co$request_uri;
}
