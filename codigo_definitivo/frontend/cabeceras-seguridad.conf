# Cabeceras de seguridad de la pagina servida por Nginx.
#
# ESTE ARCHIVO EXISTE POR UNA REGLA DE NGINX, NO POR ORDEN:
# un bloque `location` que declare CUALQUIER add_header PIERDE todos los
# add_header heredados del nivel superior. Con el bloque de HTTPS son seis
# sitios donde hay que repetirlas, y seis copias divergen. Aqui viven una vez y
# se incluyen donde hagan falta. Si se anade un location con add_header propio,
# hay que incluir este archivo tambien ahi.
#
# Por que en Nginx y no solo en Express: helmet ya protege /api, pero /api
# devuelve JSON. La pagina que EJECUTA JavaScript la sirve Nginx, y estaba
# saliendo sin ninguna cabecera. Estaba justo al reves de donde hace falta.

# CSP. Notas de por que cada origen esta permitido:
#   script-src 'self'      el build de Vite es un unico bundle propio.
#   style-src  unsafe-inline  React inyecta estilos en linea y las variables
#                          de tema del restaurante se aplican asi.
#   fonts.googleapis/gstatic  las fuentes de TEMA que elige cada restaurante
#                          (shared/tema/aplicarTema.js las inyecta al vuelo).
#                          Las de marca de Bitemo ya no: se autoalojan desde
#                          main.jsx. Si algun dia se autoalojan tambien las de
#                          tema, estos dos origenes se pueden cerrar.
#   media/img https:       el video sale de Bunny (vz-*.b-cdn.net) y cada
#                          restaurante configura su logo y su banner con una
#                          URL propia; restringirlo a un dominio romperia la
#                          personalizacion.
#   connect-src bunnycdn   la subida TUS va directa del navegador a Bunny.
#   frame-ancestors 'none' nadie puede meter el panel en un iframe
#                          (clickjacking sobre acciones de admin).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://video.bunnycdn.com https://*.b-cdn.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS. Ya SI aplica: el sitio responde por HTTPS.
#
# max-age de un ano e includeSubDomains, pero SIN preload a proposito: entrar en
# la lista de precarga de los navegadores es practicamente irreversible y deja
# el dominio inaccesible durante meses si algo sale mal con el certificado.
# Se puede anadir cuando lleve tiempo estable.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
