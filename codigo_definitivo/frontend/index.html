<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin maximum-scale: impedir el zoom es un fallo de accesibilidad (una
         carta con letra pequeña y un comensal presbicia es el caso exacto en el
         que hace falta), lo marca cualquier auditoría y iOS lo ignora desde
         hace años para el gesto de pellizcar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F8A5B" />

    <!-- ============================================================
         SEO. Va aquí y no inyectado por React a propósito: la ruta / es
         la landing y Nginx sirve este mismo index.html, así que Google y
         los previsualizadores de WhatsApp/Facebook —que NO ejecutan
         JavaScript— leen los datos correctos sin esperar al bundle.
         __SITIO__ lo sustituye el plugin seoEstatico de vite.config.js.
         ============================================================ -->
    <meta
      name="description"
      content="Convierte la carta de tu restaurante en un menú digital con QR: tus comensales ven cada plato en video y piden desde la mesa, sin descargar ninguna app."
    />
    <link rel="canonical" href="__SITIO__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Antojate" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="__SITIO__/" />
    <meta property="og:title" content="Menú digital con QR y video para restaurantes | Antojate" />
    <meta
      property="og:description"
      content="Tus comensales escanean el QR, ven cada plato en video y piden desde la mesa. Sin app y sin registro."
    />
    <meta property="og:image" content="__SITIO__/marca/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Isotipo de Antojate en línea: mismo trazado que LogoAntojate.jsx, sin archivo extra. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><mask id="m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="%23fff"/><circle cx="39" cy="6" r="7.6"/></mask></defs><g transform="rotate(-8 24 24)"><g mask="url(%23m)"><rect x="6.5" y="6.5" width="36" height="36" rx="12" fill="%23f6b931"/><rect x="3.5" y="3.5" width="36" height="36" rx="12" fill="%231f8a5b"/></g><path d="M17.5 14 29.5 21.5 17.5 29Z" fill="%23fff" stroke="%23fff" stroke-width="3.2" stroke-linejoin="round"/></g></svg>'
    />

    <!-- Ya no hay preconnect a Google Fonts: las tipografías de marca
         (Baloo 2 y Nunito Sans) se autoalojan desde main.jsx, así que la landing no
         habla con ningún dominio ajeno. Las fuentes de TEMA de cada restaurante
         sí siguen viniendo de Google, pero solo dentro de su menú y las inyecta
         shared/tema/aplicarTema.js cuando hacen falta; abrir aquí esa conexión
         para todo el mundo era pagarla también en la portada, que no la usa. -->

    <title>Menú digital con QR y video para restaurantes | Antojate</title>

    <!-- Datos estructurados (Organization + SoftwareApplication + FAQPage).
         Los genera vite.config.js a partir de contenido/preguntas.js. -->
    <script type="application/ld+json">
      __JSONLD__
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
